# Fly.io config for the Cash Moves Massive (Polygon) options-flow
# scanner worker.
#
# Long-running Deno process that polls Polygon's options-trades feed,
# qualifies prints against the whale-tail filter, and inserts rows
# into whale_tail_alerts. Lightweight (one shared-cpu-1x, 512MB).
# Separate Fly app from dxlink-worker so a Polygon outage doesn't
# touch GEX streaming.
#
# Required secrets (set via `flyctl secrets set --app cashmoves-scanner ...`):
#   MASSIVE_API_KEY            — Polygon Options Advanced API key
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY  — writes whale_tail_alerts + bot_signals
#
# Optional:
#   SCANNER_USER_IDS           — comma-separated list of user_ids to
#                                scan for. If unset, scans for every
#                                user with bot_config.enabled=true.

app = "cashmoves-scanner"
primary_region = "iad"

[build]

[env]
  # Polygon REST host (override for paper testing if needed)
  POLYGON_BASE_URL = "https://api.polygon.io"
  # Min print to qualify (USD)
  MIN_PREMIUM_DOLLARS_DEFAULT = "500000"
  # Poll every 5s during RTH; 60s outside
  POLL_INTERVAL_MS_RTH = "5000"
  POLL_INTERVAL_MS_OFF = "60000"

[[restart]]
  policy = "always"
  retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# No HTTP service — Fly health check is process-liveness only.
