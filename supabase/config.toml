# Supabase project config. Per-function overrides for verify_jwt land
# here so `supabase functions deploy <name>` (the CI workflow) picks up
# the correct gating without needing per-function CLI flags.
#
# Default behavior (no entry below) = verify_jwt = true.
# Functions listed here with `verify_jwt = false` are explicitly public.

project_id = "rghoynbaykeyjbhqmaff"

# ─── Public, anon-callable functions ───────────────────────────────
# profile-view-track:    called from /u/:slug page loads by both
#                        authenticated and anonymous viewers.
# leaderboard-public-feed: the /leaderboard page read endpoint;
#                        anyone (including logged-out users) can browse.

[functions.profile-view-track]
verify_jwt = false

[functions.leaderboard-public-feed]
verify_jwt = false

[functions.profile-public-data]
verify_jwt = false

# scan-universe-plays: cross-ticker scanner. Triggered by pg_cron
# (shared SCAN_AUTH_TOKEN bearer) or by service-role JWT for manual
# runs. Self-validates auth inside the function; no user JWT path.
[functions.scan-universe-plays]
verify_jwt = false
