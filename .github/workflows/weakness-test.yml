# Research (owner, 2026-10-20: "Go, run the weakness test"): nine price /
# business facts at each month start vs a 30% fall within 6 months, train
# < 2024 / test 2024 →, pre-registered pass mark. See scripts/weakness-test.mjs.
# Prints the report, uploads weakness-test.json, writes nothing to the DB.

name: Weakness test

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/weakness-test.mjs
      - src/utils/weakness.js
      - .github/workflows/weakness-test.yml

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Study
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: node scripts/weakness-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: weakness-test
          path: weakness-test.json
          retention-days: 30
