# Deploy the DXLink quote worker to Fly.io.
#
# Triggers:
#   - workflow_dispatch (manual run from GitHub UI / mobile app)
#   - push to dxlink-worker/** on main
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN              — Fly.io personal access token (Fly dashboard → Settings → Access Tokens)
#   TASTYTRADE_USERNAME        — Tastytrade prod login
#   TASTYTRADE_PASSWORD        — Tastytrade prod password
#   SUPABASE_URL               — https://rghoynbaykeyjbhqmaff.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  — from Supabase project settings → API
#
# First run creates the app via `flyctl launch --no-deploy` (idempotent —
# does nothing if the app already exists). Subsequent runs just deploy
# updates with `flyctl deploy --remote-only`.

name: Deploy DXLink Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dxlink-worker/**'
      - '.github/workflows/deploy-dxlink-worker.yml'

concurrency:
  group: dxlink-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dxlink-worker
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Diagnostic — prints flyctl version and the orgs the API token
      # has access to. Helps debug "wrong org" issues without needing
      # to open the Fly dashboard.
      - name: Show flyctl context
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl version
          echo "---"
          echo "orgs visible to this token:"
          flyctl orgs list || true
          echo "---"
          echo "apps in default org:"
          flyctl apps list || true

      # `flyctl status` exits non-zero when the app doesn't exist, so
      # we use that as the existence check. Errors out of create now
      # surface loudly instead of being swallowed by `set +e`.
      - name: Ensure Fly app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl status -a pharma-edge >/dev/null 2>&1; then
            echo "app pharma-edge already exists"
          else
            echo "creating app pharma-edge"
            flyctl apps create pharma-edge
          fi
          # Confirm we can talk to it before moving on.
          flyctl status -a pharma-edge

      # Sync secrets from GitHub Actions to Fly. --stage queues the
      # secrets without triggering a redeploy mid-pipeline; the deploy
      # step below picks them up.
      - name: Sync Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            TASTYTRADE_USERNAME="${{ secrets.TASTYTRADE_USERNAME }}" \
            TASTYTRADE_PASSWORD="${{ secrets.TASTYTRADE_PASSWORD }}" \
            SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --app pharma-edge \
            --stage

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app pharma-edge

      - name: Tail logs (10s sample)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Best-effort sample of the freshly-deployed instance's
          # boot logs. Helps debug from the Actions run page if
          # secrets are wrong without needing to open the Fly UI.
          timeout 10 flyctl logs --app pharma-edge || true
