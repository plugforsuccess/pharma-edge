# LDP engine tests: risk tiers, satellite caps, contract filters, tax
# math, exit ladder, sell-rule priority, Tradier adapter, and the
# tax-snapshot drift guard against the Supabase migration seed.

name: LDP engine tests

on:
  pull_request:
    paths:
      - 'ldp/**'
      - 'supabase/migrations/20261002000000_after_tax_leaps.sql'
      - '.github/workflows/ldp-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ldp/**'
      - 'supabase/migrations/20261002000000_after_tax_leaps.sql'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ldp/requirements-dev.txt
      - run: python -m pytest -q ldp
