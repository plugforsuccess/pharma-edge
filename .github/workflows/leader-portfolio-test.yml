# Research (owner, 2026-10-19: "tweak the leaders to beat the S&P" → "Sure"): ways to
# hold the Leaders basket (top N, core + satellite, switch) vs SPY, fixed pass mark. See
# scripts/leader-portfolio-test.mjs. Prints the report, uploads leader-portfolio-test.json,
# writes nothing to the DB.

name: Leader portfolio test

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/leader-portfolio-test.mjs
      - .github/workflows/leader-portfolio-test.yml

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Study
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/leader-portfolio-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: leader-portfolio-test
          path: leader-portfolio-test.json
          retention-days: 30
