# Polls open positions every 5 min during US RTH and fires alerts
# when Cash Moves thresholds hit (-50% stop, +50/+100/+200 profit
# ladder, 21 DTE warning, expiring tomorrow).
#
# Idempotent on `triggers_fired` JSONB so repeated cron runs only
# send a given alert once per position.
#
# SCHEDULING has moved to Supabase pg_cron — see
# supabase/migrations/20260514110000_monitor_positions_cron.sql
# (job: monitor-positions-rth). GitHub Actions cron was dropping
# ticks under hosted-runner load; pg_cron runs in-database and
# doesn't slip. The workflow stays around as a manual rescue lever
# (Actions → Monitor open positions → Run workflow) for when the
# pg_cron job is paused or the user wants an immediate refresh.

name: Monitor open positions

on:
  workflow_dispatch:

concurrency:
  group: monitor-positions
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke monitor-positions edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          resp=$(curl -sS -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/functions/v1/monitor-positions" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          http=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | head -n -1)
          echo "monitor-positions status=${http} body=${body}"
          if [ "$http" != "200" ]; then
            echo "::error::monitor-positions returned ${http}"
            exit 1
          fi
