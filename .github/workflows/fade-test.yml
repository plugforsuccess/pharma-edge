# Research (owner spec, 2026-10-26: the Fade Screen): six factors on an
# SEC-built pre-revenue small-cap universe vs a 40% fall / a double within
# 6 months, train < 2024 / test 2024 →, pre-registered pass mark. See
# scripts/fade-test.mjs. Prints the report, uploads fade-test.json, writes
# nothing to the DB.

name: Fade Screen test

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/fade-test.mjs
      - scripts/lib/secUniverse.mjs
      - scripts/lib/form345.mjs
      - scripts/lib/secFilings.mjs
      - scripts/lib/finra.mjs
      - src/utils/fade.js
      - src/utils/straddle.js
      - src/utils/secondJump.js
      - .github/workflows/fade-test.yml

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Study
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: node scripts/fade-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fade-test
          path: fade-test.json
          retention-days: 30
