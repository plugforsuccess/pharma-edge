# Universe replay (owner, 2026-10-03): replays every ticker day by day with
# no look-ahead, trades a priced LEAPS call on each entry rule × exit rule,
# grades big moves (catch rate, kept share, misses) and runs the walk-forward
# test of the history filter. Writes one replay_runs row; the Charts →
# Signal record page reads the latest. See scripts/replay-universe.mjs.

name: Universe replay

on:
  schedule:
    - cron: '17 14 * * 6'   # Saturdays 14:17 UTC — weekly, markets closed
  workflow_dispatch:
    inputs:
      mode:
        description: 'write = save to replay_runs · dry-run = print only'
        type: choice
        options: [write, dry-run]
        default: write
      spotlight:
        description: 'Tickers to keep every trade for (comma-separated)'
        default: 'NOW'
  push:
    branches-ignore: [main]
    paths:
      - scripts/replay-universe.mjs
      - scripts/lib/marketData.mjs
      - src/utils/replay.js
      - .github/workflows/replay-universe.yml

concurrency:
  group: replay-universe
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-replay.mjs
      - name: Replay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPOTLIGHT: ${{ inputs.spotlight || 'NOW,PLTR,NVDA' }}
        run: node scripts/replay-universe.mjs --mode "${{ inputs.mode || 'write' }}"
