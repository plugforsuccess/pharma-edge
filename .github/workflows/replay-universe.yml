# Universe replay (owner, 2026-10-03): replays every ticker day by day with
# no look-ahead; since 2026-10-05 it also runs the pre-registered test
# (docs/signal-engine/preregistration.md: matched controls, IV proxy,
# slippage tiers, trade export → replay_trades). Original description:
# no look-ahead, trades a priced LEAPS call on each entry rule × exit rule,
# grades big moves (catch rate, kept share, misses) and runs the walk-forward
# test of the history filter. Writes one replay_runs row; the Charts →
# Signal record page reads the latest. See scripts/replay-universe.mjs.

name: Universe replay

on:
  schedule:
    - cron: '17 14 * * 6'   # Saturdays 14:17 UTC — weekly, markets closed
  workflow_dispatch:
    inputs:
      mode:
        description: 'write = save to replay_runs · dry-run = print only'
        type: choice
        options: [write, dry-run]
        default: write
      spotlight:
        description: 'Tickers to keep every trade for (comma-separated)'
        default: 'NOW'
  push:
    branches-ignore: [main]
    paths:
      - scripts/replay-universe.mjs
      - scripts/lib/marketData.mjs
      - scripts/lib/prereg.mjs
      - src/utils/replay.js
      - src/utils/controls.js
      - .github/workflows/replay-universe.yml

concurrency:
  group: replay-universe
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-replay.mjs
      - run: node scripts/check-controls.mjs
      - name: Replay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPOTLIGHT: ${{ inputs.spotlight || 'NOW,PLTR,NVDA' }}
          REPLAY_TRADES_OUT: replay_trades.csv
          # The job holds every ticker's bars, model and replay runs in memory;
          # the default heap (~2 GB) was not enough once the swing grid joined.
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/replay-universe.mjs --mode "${{ inputs.mode || 'write' }}"
      # The trade-level file (one row per strategy trade at the calibrated
      # premium) — the pre-registered test's later steps run off it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-trades
          path: replay_trades.csv
          if-no-files-found: ignore
          retention-days: 90
