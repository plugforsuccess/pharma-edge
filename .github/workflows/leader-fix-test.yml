# Research (owner, 2026-10-19: fix the Leaders list — "Yes"): variants of the
# rule held as monthly baskets vs SPY and any stock, train < 2024 / test 2024+. See
# scripts/leader-fix-test.mjs. Prints the report, uploads leader-fix-test.json,
# writes nothing to the DB.

name: Leader fix test

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/leader-fix-test.mjs
      - .github/workflows/leader-fix-test.yml

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Study
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/leader-fix-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: leader-fix-test
          path: leader-fix-test.json
          retention-days: 30
