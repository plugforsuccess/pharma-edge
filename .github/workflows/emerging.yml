# Research (owner, 2026-10-17: "how can we find leaders like Charles lab …
# before they become leaders" → "just emerging"). See scripts/emerging.mjs.
# Prints the report, uploads emerging.json, writes nothing to the DB.

name: Emerging

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/emerging.mjs
      - .github/workflows/emerging.yml

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Study
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/emerging.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: emerging
          path: emerging.json
          retention-days: 30
