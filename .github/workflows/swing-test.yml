# Research (owner, 2026-10-16: "Run it"): can short option swings on leaders
# make money with a spot target, stop or dip entry? See
# scripts/swing-test.mjs. Prints the report, uploads swing-test.json,
# writes nothing to the DB.

name: Swing test

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - scripts/swing-test.mjs
      - .github/workflows/swing-test.yml

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Study
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/swing-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: swing-test
          path: swing-test.json
          retention-days: 30
