# LDP engine — default thresholds. Mirrors the defaults in ldp/config.py;
# copy this file and edit values to override. Unknown keys are rejected.

[risk]
min_account_aggressive = 25000
min_horizon_years = 2

[satellite]
max_per_name = 0.05          # of account value at buy
max_total = 0.15             # of account value
min_runway_months = 12
catalyst_blackout_days = 14
sell_on_blackout_catalyst = true
min_score = 0.5

[satellite.weights]
runway = 0.25
catalysts = 0.20
dilution = 0.20
institutional = 0.15
short_interest = 0.10
momentum = 0.10

[contracts]
min_dte_days = 540
target_dte_days = 730
core_delta_min = 0.70
core_delta_max = 0.80
satellite_delta_min = 0.60
satellite_delta_max = 0.80
max_iv_rank = 70
max_spread_pct = 0.10        # of mid
min_open_interest = 100
reject_missing_iv_rank = true

[orders]                     # limit orders only — never market
step_pct_of_spread = 0.25    # step from mid toward the ask by 25% of the spread
max_steps = 4                # cancel after this many prices
step_wait_seconds = 60
poll_interval_seconds = 5
tick_size = 0.05
duration = "day"
place_target_order_on_entry = true
target_order_duration = "gtc"

[exits]
# Playbook: targets are pre-tax gains on the option (1.0 = +100%).
ladder = [1.0, 2.0]
rung_fractions = [0.70, 0.15]  # share of the original position; the rest (15%) is the runner
runner_trail_pct = 0.30        # runner exits on a 30% give-back from its peak
roll_dte_days = 180            # time stop: exit or roll with 6 months left
roll_warn_dte_days = 270       # roll window opens at 9 months left
ltcg_wait_days = 60            # wait for long-term only if this close and before the roll window
# stop_loss_pct = 0.50         # unset = no hard price stop (cut only on a broken thesis)

[core]
top_n_sectors = 3
allocation_pct = 0.30
require_above_200dma = true

[core.weights]
ret_3m = 0.20
ret_6m = 0.30
ret_12m = 0.30
rel_strength = 0.20

[cadence]
buy_window_start = "01-15"   # MM-DD
buy_window_days = 21
