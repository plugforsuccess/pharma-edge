# Fly.io config for the Cash Moves DXLink worker.
#
# NOTE: `app = "pharma-edge"` is intentionally retained — it's the
# stable Fly app identifier created during the original brand era.
# Renaming would orphan the running machines + secrets and require a
# full re-deploy. The brand-facing name is "Cash Moves" everywhere
# user-visible; the Fly slug stays put.
#
# Two processes share this app + its secrets:
#   * worker  — long-running DXLink WebSocket subscriber (the original
#               GEX feed). Streams Greeks + quotes to dxlink_quotes.
#   * scanner — polls Polygon (Massive) options-flow REST API every 5s
#               during RTH, qualifies prints, writes whale_tail_alerts.
# Both run on their own shared-cpu-1x machines but inherit the SAME
# Fly secret bag (SUPABASE_*, TASTYTRADE_*, MASSIVE_API_KEY). That's
# why they're consolidated here instead of standing up a second app —
# the Supabase service-role key is already configured on this app.
#
# Memory: worker needs 1GB for the dxFeed subscription burst (see the
# OOM history comment below). Scanner is REST-polling and stays well
# under 512MB, but to keep [[vm]] simple we run both at 1GB.
#
# Memory: 1GB. The 256MB cap was too tight — V8's baseline (~80MB) +
# 64k active dxFeed subscriptions + WebSocket frame buffers + the
# in-memory shadow Map keyed by streamer symbol pushes resident
# memory close to 200MB during the subscription burst, and Linux
# OOM-killed the process at 138MB resident (cgroup accounting
# punishes V8's 34GB virtual reservation). 1GB gives headroom for
# growth + GC overhead without ballooning the bill (shared-cpu-1x
# at 1GB is still cents/day).
#
# auto_stop_machines/auto_start_machines/min_machines_running locked
# in explicitly so a Fly host event or transient crash doesn't leave
# us flying blind for hours. The [[restart]] policy ensures Deno
# fatal-exits (e.g. token refresh failure) re-launch automatically.

app = "pharma-edge"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TASTYTRADE_BASE_URL = "https://api.tastyworks.com"
  FLUSH_INTERVAL_MS = "750"
  # Scanner-only knobs (worker ignores)
  POLYGON_BASE_URL = "https://api.polygon.io"
  MIN_PREMIUM_DOLLARS_DEFAULT = "500000"
  POLL_INTERVAL_MS_RTH = "5000"
  POLL_INTERVAL_MS_OFF = "60000"

[processes]
  worker  = "deno run --allow-net --allow-env src/main.ts"
  scanner = "deno run --allow-net --allow-env src/scanner/main.ts"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[restart]]
  policy = "always"
  retries = 10

# No [[services]] block — neither process accepts incoming HTTP.
# Fly will use the process check (is the container running?) as health.

[deploy]
  strategy = "immediate"  # one instance per process, no rolling

# Long-running workers, NOT request-handling apps — never auto-stop
# on idle, always keep one machine per process running, auto-start
# on Fly-side restarts.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

# No [mounts] section — both processes are stateless; all state lives
# in Supabase. (An empty [mounts] table makes Fly try to bind a volume
# named "" to the machine, which errors deploy.)
